<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Claude Opus 5와 Fable 5 전문 업무 ELO 비교</title>
  <desc id="desc">GDPval-AA v2와 AA-Briefcase에서 Opus 5가 Fable 5보다 높은 ELO를 기록했다.</desc>
  <rect width="1000" height="650" fill="#f7faf9"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill: #14201c; letter-spacing: 0; }
    .muted { fill: #60706a; }
    .track { fill: #e3ebe7; }
    .opus { fill: #0a9b6c; }
    .fable { fill: #d66a3f; }
    .rule { stroke: #d6e1dc; stroke-width: 2; }
  </style>
  <text x="54" y="72" font-size="34" font-weight="700">전문 업무 결과물은 Opus 5가 확실히 앞섰다</text>
  <text x="54" y="112" font-size="21" class="muted">블라인드 비교를 ELO로 환산 · 높은 값이 좋음</text>
  <rect x="648" y="56" width="20" height="20" class="opus"/><text x="678" y="73" font-size="19">Opus 5</text>
  <rect x="800" y="56" width="20" height="20" class="fable"/><text x="830" y="73" font-size="19">Fable 5</text>

  <text x="54" y="214" font-size="24" font-weight="700">GDPval-AA v2</text>
  <text x="54" y="246" font-size="18" class="muted">44개 직업, 9개 산업의 실제 업무 산출물</text>
  <rect x="350" y="188" width="560" height="28" rx="4" class="track"/><rect x="350" y="188" width="521" height="28" rx="4" class="opus"/>
  <text x="883" y="210" font-size="19" font-weight="700">1861</text>
  <rect x="350" y="230" width="560" height="28" rx="4" class="track"/><rect x="350" y="230" width="489" height="28" rx="4" class="fable"/>
  <text x="851" y="252" font-size="19" font-weight="700">1747</text>

  <text x="54" y="382" font-size="24" font-weight="700">AA-Briefcase</text>
  <text x="54" y="414" font-size="18" class="muted">여러 주와 수천 개 파일을 다루는 장기 프로젝트</text>
  <rect x="350" y="356" width="560" height="28" rx="4" class="track"/><rect x="350" y="356" width="482" height="28" rx="4" class="opus"/>
  <text x="844" y="378" font-size="19" font-weight="700">1720</text>
  <rect x="350" y="398" width="560" height="28" rx="4" class="track"/><rect x="350" y="398" width="441" height="28" rx="4" class="fable"/>
  <text x="803" y="420" font-size="19" font-weight="700">1574</text>

  <rect x="54" y="486" width="892" height="88" rx="6" fill="#e6f4ee" stroke="#b8d9cb"/>
  <text x="82" y="526" font-size="21" font-weight="700" class="opus">Opus 5 차이</text>
  <text x="222" y="526" font-size="21">GDPval-AA +114 ELO · AA-Briefcase +146 ELO</text>
  <text x="82" y="556" font-size="17" class="muted">두 평가는 Artificial Analysis가 독립적으로 수행했다.</text>

  <line x1="54" y1="604" x2="946" y2="604" class="rule"/>
  <text x="946" y="632" text-anchor="end" font-size="16" class="muted">Source: Artificial Analysis · Anthropic System Card</text>
</svg>
