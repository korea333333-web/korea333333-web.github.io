<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" role="img" aria-labelledby="title desc">
  <title id="title">중국 로봇 수출이 한국 산업에 전달되는 경로</title>
  <desc id="desc">중국의 규모와 가격 경쟁이 해외 시장과 한국 제조 현장에 전달되고 한국이 무역구제, 핵심 부품, 소프트웨어와 서비스로 대응하는 구조를 정리한 도표</desc>
  <rect width="390" height="900" rx="24" fill="#f4f8f7"/>
  <g font-family="Arial, 'Malgun Gothic', sans-serif">
    <text x="28" y="48" fill="#17322d" font-size="21" font-weight="800">중국 로봇 수출, 한국에 오는 경로</text>
    <text x="28" y="75" fill="#5f746f" font-size="14.5">가격 충격과 기술 경쟁을 따로 봐야 한다</text>

    <rect x="28" y="110" width="334" height="144" rx="20" fill="#fff0df" stroke="#edc295"/>
    <text x="48" y="145" fill="#9a4f18" font-size="17" font-weight="800">1. 중국의 규모·가격·내수 학습</text>
    <text x="48" y="178" fill="#455c56" font-size="14.5">큰 내수 제조시장 → 더 많은 설치 데이터</text>
    <text x="48" y="205" fill="#455c56" font-size="14.5">부품 집적 → 낮은 조달비와 빠른 반복</text>
    <text x="48" y="232" fill="#455c56" font-size="14.5">오픈 모델 → 제어 소프트웨어 실험 확대</text>

    <path d="M195 267 L195 302" stroke="#8aa8a0" stroke-width="4"/>
    <path d="M187 294 L195 305 L203 294" fill="none" stroke="#8aa8a0" stroke-width="4"/>

    <rect x="28" y="314" width="334" height="144" rx="20" fill="#e9f0ff" stroke="#bfd0ef"/>
    <text x="48" y="349" fill="#315eae" font-size="17" font-weight="800">2. 해외 시장에서의 패키지 경쟁</text>
    <text x="48" y="382" fill="#455c56" font-size="14.5">로봇 본체만이 아니라 설치·통합·유지보수</text>
    <text x="48" y="409" fill="#455c56" font-size="14.5">3D 프린터는 소재·설계 소프트웨어와 결합</text>
    <text x="48" y="436" fill="#455c56" font-size="14.5">중저가 시장부터 표준과 생태계를 넓힌다</text>

    <path d="M195 471 L195 506" stroke="#8aa8a0" stroke-width="4"/>
    <path d="M187 498 L195 509 L203 498" fill="none" stroke="#8aa8a0" stroke-width="4"/>

    <rect x="28" y="518" width="334" height="144" rx="20" fill="#fdebed" stroke="#ebc2c8"/>
    <text x="48" y="553" fill="#a23e4b" font-size="17" font-weight="800">3. 한국 제조업의 이중 압력</text>
    <text x="48" y="586" fill="#455c56" font-size="14.5">수요자는 자동화 비용 하락의 이익을 본다</text>
    <text x="48" y="613" fill="#455c56" font-size="14.5">국내 공급사는 저가 수입·해외 수주와 경쟁</text>
    <text x="48" y="640" fill="#455c56" font-size="14.5">부품의 중국 의존은 공급망 위험도 키운다</text>

    <path d="M195 675 L195 710" stroke="#8aa8a0" stroke-width="4"/>
    <path d="M187 702 L195 713 L203 702" fill="none" stroke="#8aa8a0" stroke-width="4"/>

    <rect x="28" y="722" width="334" height="130" rx="20" fill="#e6f4ed" stroke="#b8dbc9"/>
    <text x="48" y="757" fill="#28745a" font-size="17" font-weight="800">한국의 현실적 대응</text>
    <text x="48" y="790" fill="#455c56" font-size="14.5">공정 데이터·정밀 제어·안전 인증을 묶고</text>
    <text x="48" y="817" fill="#455c56" font-size="14.5">무역구제와 핵심 부품 다변화를 병행한다</text>

    <text x="31" y="880" fill="#5f746f" font-size="13.5">값싼 하드웨어를 막는 것만으로 경쟁력은 생기지 않는다.</text>
  </g>
</svg>
