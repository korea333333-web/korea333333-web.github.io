<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
  <title id="title">Claude Opus 5와 Fable 5 코딩 벤치마크 비교</title>
  <desc id="desc">여섯 개 코딩 벤치마크에서 Opus 5와 Fable 5의 점수를 비교한다.</desc>
  <rect width="1000" height="1060" fill="#f7faf9"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill: #14201c; letter-spacing: 0; }
    .muted { fill: #60706a; }
    .track { fill: #e3ebe7; }
    .opus { fill: #0a9b6c; }
    .fable { fill: #d66a3f; }
    .rule { stroke: #d6e1dc; stroke-width: 2; }
  </style>
  <text x="54" y="70" font-size="34" font-weight="700">코딩은 “Fable 완승”이 아니다</text>
  <text x="54" y="110" font-size="21" class="muted">점수 단위: %, 각 모델의 시스템 카드 표에 기재된 설정 기준</text>
  <rect x="596" y="54" width="20" height="20" class="opus"/><text x="626" y="71" font-size="19">Opus 5</text>
  <rect x="746" y="54" width="20" height="20" class="fable"/><text x="776" y="71" font-size="19">Fable 5</text>

  <g transform="translate(0 150)">
    <text x="54" y="28" font-size="22" font-weight="650">SWE-bench Pro</text>
    <rect x="330" y="0" width="560" height="24" rx="4" class="track"/><rect x="330" y="0" width="444" height="24" rx="4" class="opus"/>
    <text x="786" y="20" font-size="18" font-weight="700">79.2</text>
    <rect x="330" y="34" width="560" height="24" rx="4" class="track"/><rect x="330" y="34" width="448" height="24" rx="4" class="fable"/>
    <text x="790" y="54" font-size="18" font-weight="700">80.0</text>
  </g>

  <g transform="translate(0 292)">
    <text x="54" y="28" font-size="22" font-weight="650">SWE-bench Multilingual</text>
    <rect x="330" y="0" width="560" height="24" rx="4" class="track"/><rect x="330" y="0" width="501" height="24" rx="4" class="opus"/>
    <text x="843" y="20" font-size="18" font-weight="700">89.5</text>
    <rect x="330" y="34" width="560" height="24" rx="4" class="track"/><rect x="330" y="34" width="485" height="24" rx="4" class="fable"/>
    <text x="827" y="54" font-size="18" font-weight="700">86.6</text>
  </g>

  <g transform="translate(0 434)">
    <text x="54" y="28" font-size="22" font-weight="650">SWE-bench Multimodal</text>
    <rect x="330" y="0" width="560" height="24" rx="4" class="track"/><rect x="330" y="0" width="333" height="24" rx="4" class="opus"/>
    <text x="675" y="20" font-size="18" font-weight="700">59.4</text>
    <rect x="330" y="34" width="560" height="24" rx="4" class="track"/><rect x="330" y="34" width="303" height="24" rx="4" class="fable"/>
    <text x="645" y="54" font-size="18" font-weight="700">54.1</text>
  </g>

  <g transform="translate(0 576)">
    <text x="54" y="28" font-size="22" font-weight="650">DeepSWE v1.1</text>
    <rect x="330" y="0" width="560" height="24" rx="4" class="track"/><rect x="330" y="0" width="385" height="24" rx="4" class="opus"/>
    <text x="727" y="20" font-size="18" font-weight="700">68.8</text>
    <rect x="330" y="34" width="560" height="24" rx="4" class="track"/><rect x="330" y="34" width="390" height="24" rx="4" class="fable"/>
    <text x="732" y="54" font-size="18" font-weight="700">69.7</text>
  </g>

  <g transform="translate(0 718)">
    <text x="54" y="28" font-size="22" font-weight="650">FrontierCode 1.1</text>
    <rect x="330" y="0" width="560" height="24" rx="4" class="track"/><rect x="330" y="0" width="299" height="24" rx="4" class="opus"/>
    <text x="641" y="20" font-size="18" font-weight="700">53.4</text>
    <rect x="330" y="34" width="560" height="24" rx="4" class="track"/><rect x="330" y="34" width="300" height="24" rx="4" class="fable"/>
    <text x="642" y="54" font-size="18" font-weight="700">53.5</text>
  </g>

  <g transform="translate(0 860)">
    <text x="54" y="28" font-size="22" font-weight="650">FrontierBench v0.1</text>
    <rect x="330" y="0" width="560" height="24" rx="4" class="track"/><rect x="330" y="0" width="242" height="24" rx="4" class="opus"/>
    <text x="584" y="20" font-size="18" font-weight="700">43.3</text>
    <rect x="330" y="34" width="560" height="24" rx="4" class="track"/><rect x="330" y="34" width="189" height="24" rx="4" class="fable"/>
    <text x="531" y="54" font-size="18" font-weight="700">33.8</text>
  </g>

  <line x1="54" y1="978" x2="946" y2="978" class="rule"/>
  <text x="54" y="1018" font-size="18" class="muted">Opus 5 우세 3개 · Fable 5 우세 3개</text>
  <text x="946" y="1018" text-anchor="end" font-size="16" class="muted">Source: Anthropic System Card, Table 8.1.A</text>
</svg>
