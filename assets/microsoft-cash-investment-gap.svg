<svg xmlns="http://www.w3.org/2000/svg" width="620" height="820" viewBox="0 0 620 820" role="img" aria-labelledby="title desc">
  <title id="title">마이크로소프트 4분기 영업현금과 설비 지출 비교</title>
  <desc id="desc">2025년과 2026년 4분기 영업현금흐름을 설비와 장비 현금 지출, 지출 후 남은 현금으로 나눠 비교한 도표</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171126"/>
      <stop offset="1" stop-color="#25163f"/>
    </linearGradient>
    <linearGradient id="spend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="remain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="620" height="820" rx="28" fill="url(#bg2)"/>
  <circle cx="552" cy="84" r="100" fill="#c084fc" opacity=".10"/>
  <circle cx="80" cy="744" r="128" fill="#2dd4bf" opacity=".08"/>

  <text x="40" y="62" fill="#d8b4fe" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">QUARTER ENDED JUNE 30 · USD</text>
  <text x="40" y="105" fill="#ffffff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="29" font-weight="800">현금 창출은 늘었지만</text>
  <text x="40" y="142" fill="#ffffff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="29" font-weight="800">투자 속도는 더 빨랐다</text>
  <text x="40" y="177" fill="#c9bddb" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">영업현금에서 설비·장비 현금지출을 단순 차감한 비교</text>

  <rect x="40" y="214" width="18" height="18" rx="5" fill="url(#spend)"/>
  <text x="68" y="229" fill="#e8ddf6" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">설비·장비 현금지출</text>
  <rect x="259" y="214" width="18" height="18" rx="5" fill="url(#remain)"/>
  <text x="287" y="229" fill="#e8ddf6" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">지출 뒤 남은 현금</text>

  <text x="40" y="288" fill="#ffffff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800">2025년 4분기</text>
  <text x="580" y="288" fill="#c9bddb" text-anchor="end" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17">영업현금 426억 달러</text>
  <rect x="40" y="310" width="369" height="72" rx="14" fill="#34254e"/>
  <rect x="40" y="310" width="148" height="72" rx="14" fill="url(#spend)"/>
  <path d="M188 310 H200 V382 H188" fill="#34254e"/>
  <rect x="188" y="310" width="221" height="72" rx="14" fill="url(#remain)"/>
  <text x="114" y="340" text-anchor="middle" fill="#ffffff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="800">171억</text>
  <text x="114" y="365" text-anchor="middle" fill="#f4e8ff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">설비 지출</text>
  <text x="298" y="340" text-anchor="middle" fill="#062c28" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="800">256억</text>
  <text x="298" y="365" text-anchor="middle" fill="#083b35" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">남은 현금</text>

  <text x="40" y="458" fill="#ffffff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800">2026년 4분기</text>
  <text x="580" y="458" fill="#c9bddb" text-anchor="end" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17">영업현금 554억 달러</text>
  <rect x="40" y="480" width="480" height="72" rx="14" fill="#34254e"/>
  <rect x="40" y="480" width="310" height="72" rx="14" fill="url(#spend)"/>
  <path d="M350 480 H362 V552 H350" fill="#34254e"/>
  <rect x="350" y="480" width="170" height="72" rx="14" fill="url(#remain)"/>
  <text x="195" y="510" text-anchor="middle" fill="#ffffff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="800">358억</text>
  <text x="195" y="535" text-anchor="middle" fill="#f4e8ff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">설비 지출</text>
  <text x="435" y="510" text-anchor="middle" fill="#062c28" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="800">196억</text>
  <text x="435" y="535" text-anchor="middle" fill="#083b35" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">남은 현금</text>

  <rect x="40" y="598" width="250" height="108" rx="18" fill="#2d2044" stroke="#714aa3"/>
  <text x="64" y="632" fill="#d8b4fe" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700">설비 현금지출 변화</text>
  <text x="64" y="678" fill="#ffffff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="800">+109.6%</text>

  <rect x="310" y="598" width="270" height="108" rx="18" fill="#173b39" stroke="#2d8178"/>
  <text x="334" y="632" fill="#86efe3" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700">지출 뒤 남은 현금 변화</text>
  <text x="334" y="678" fill="#ffffff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="800">-23.2%</text>

  <text x="40" y="753" fill="#b8aacd" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">출처: Microsoft FY2026 Q4 현금흐름표 · 자체 계산</text>
  <text x="40" y="778" fill="#b8aacd" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">총 CapEx 410억 달러는 금융리스 등을 포함해 위 현금지출과 다르다</text>
  <text x="40" y="802" fill="#b8aacd" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">반올림 때문에 표시값의 합계가 1억 달러 안팎 차이 날 수 있다</text>
</svg>
