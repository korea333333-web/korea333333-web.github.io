<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 제한 모드를 안전하게 시험하는 순서</title>
  <desc id="desc">낯선 코드나 문서를 제한 모드에서 먼저 살펴본 뒤 사람이 확인하고, 실행이 필요할 때만 별도 보호 환경으로 넘기는 네 단계 흐름도</desc>
  <rect width="900" height="1100" rx="34" fill="#f5f6f4"/>
  <text x="70" y="84" fill="#17232d" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="38" font-weight="800">낯선 코드는 먼저 읽기만 시킨다</text>
  <text x="70" y="132" fill="#596873" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="31">실행이 필요해지면 별도 보호 절차로 넘긴다</text>

  <rect x="70" y="190" width="760" height="160" rx="24" fill="#fff" stroke="#d6dadd" stroke-width="2"/>
  <circle cx="124" cy="242" r="28" fill="#5e4ab6"/>
  <text x="124" y="253" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="800">1</text>
  <text x="174" y="239" fill="#17232d" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="800">낯선 자료를 별도 작업 폴더에 둔다</text>
  <text x="174" y="284" fill="#52616c" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="31">외부 저장소·첨부 코드를 운영 환경과 분리한다.</text>
  <text x="174" y="323" fill="#52616c" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="31">비밀번호와 배포 열쇠도 넣지 않는다.</text>

  <path d="M450 350v43" stroke="#9a7a3c" stroke-width="5" stroke-linecap="round"/>
  <path d="M436 382l14 16 14-16" fill="none" stroke="#9a7a3c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="70" y="408" width="760" height="174" rx="24" fill="#fff0dd" stroke="#dfb66e" stroke-width="2"/>
  <circle cx="124" cy="461" r="28" fill="#a45a12"/>
  <text x="124" y="472" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="800">2</text>
  <text x="174" y="458" fill="#17232d" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="800">claude --restricted로 살펴본다</text>
  <text x="174" y="503" fill="#52616c" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="31">파일 구조와 위험해 보이는 부분을 먼저 묻는다.</text>
  <text x="174" y="542" fill="#52616c" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="31">명령·WebFetch와 남은 MCP를 확인한다.</text>

  <path d="M450 582v43" stroke="#9a7a3c" stroke-width="5" stroke-linecap="round"/>
  <path d="M436 614l14 16 14-16" fill="none" stroke="#9a7a3c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="70" y="640" width="760" height="160" rx="24" fill="#eaf5f1" stroke="#9fc9bd" stroke-width="2"/>
  <circle cx="124" cy="692" r="28" fill="#167267"/>
  <text x="124" y="703" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="800">3</text>
  <text x="174" y="689" fill="#17232d" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="800">사람이 설명과 변경 제안을 확인한다</text>
  <text x="174" y="734" fill="#52616c" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="31">놓친 파일과 민감 정보 노출을 확인한다.</text>
  <text x="174" y="773" fill="#52616c" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="31">제한 모드를 검토 완료 표시로 쓰지 않는다.</text>

  <path d="M450 800v43" stroke="#9a7a3c" stroke-width="5" stroke-linecap="round"/>
  <path d="M436 832l14 16 14-16" fill="none" stroke="#9a7a3c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="70" y="858" width="760" height="166" rx="24" fill="#eeeafd" stroke="#c5b9ef" stroke-width="2"/>
  <circle cx="124" cy="911" r="28" fill="#5e4ab6"/>
  <text x="124" y="922" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="800">4</text>
  <text x="174" y="908" fill="#17232d" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="800">실행은 별도 보호 환경에서 한다</text>
  <text x="174" y="953" fill="#52616c" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="31">테스트는 샌드박스와 최소 권한으로 실행한다.</text>
  <text x="174" y="992" fill="#52616c" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="31">병합과 배포는 기존 사람 승인에 남긴다.</text>
</svg>
