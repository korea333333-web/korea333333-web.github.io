<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">낮은 해상도 초안을 시험하고 최종 출력 해상도를 고르는 네 단계</title>
  <desc id="desc">참고 장면과 360p 초안을 시험한 뒤 장면의 시작과 끝 또는 연장 구간을 지시하고 최종 요청의 출력 해상도를 고르는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f3ee"/><stop offset="1" stop-color="#e9eef7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#243047" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="900" height="1200" rx="34" fill="url(#bg)"/>
  <text x="60" y="78" fill="#20293a" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="54" font-weight="800">영상 한 편을 한 번에 뽑지 않는다</text>
  <text x="60" y="132" fill="#536078" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="34" font-weight="500">싸게 시험하고, 장면을 잇고, 최종 해상도를 고른다</text>
  <g filter="url(#shadow)"><rect x="60" y="185" width="780" height="190" rx="26" fill="#ffffff"/><rect x="60" y="185" width="16" height="190" rx="8" fill="#7462c8"/></g>
  <text x="105" y="235" fill="#6755bb" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="800">1 · 재료 고르기</text>
  <text x="105" y="290" fill="#20293a" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="44" font-weight="800">글·사진·짧은 참고 영상</text>
  <text x="105" y="340" fill="#536078" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="34" font-weight="500">참고 영상은 최대 3개, 각각 최대 3초</text>
  <path d="M450 383v32" stroke="#7564c4" stroke-width="8" stroke-linecap="round"/><path d="M433 405l17 18 17-18" fill="none" stroke="#7564c4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)"><rect x="60" y="430" width="780" height="190" rx="26" fill="#ffffff"/><rect x="60" y="430" width="16" height="190" rx="8" fill="#27a787"/></g>
  <text x="105" y="480" fill="#14775f" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="800">2 · 초안 비교</text>
  <text x="105" y="535" fill="#20293a" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="44" font-weight="800">360p로 여러 장면을 시험</text>
  <text x="105" y="585" fill="#536078" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="34" font-weight="500">인물 위치·카메라 방향·분위기를 먼저 확인</text>
  <path d="M450 628v32" stroke="#27a787" stroke-width="8" stroke-linecap="round"/><path d="M433 650l17 18 17-18" fill="none" stroke="#27a787" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)"><rect x="60" y="675" width="780" height="205" rx="26" fill="#ffffff"/><rect x="60" y="675" width="16" height="205" rx="8" fill="#df8a30"/></g>
  <text x="105" y="725" fill="#a85b16" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="800">3 · 움직임과 연결 지시</text>
  <text x="105" y="780" fill="#20293a" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="44" font-weight="800">시작·끝 화면 또는 다음 장면</text>
  <text x="105" y="830" fill="#536078" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="34" font-weight="500">연장 구간 3~10초, 발표상 누적 최대 40초</text>
  <path d="M450 888v32" stroke="#df8a30" stroke-width="8" stroke-linecap="round"/><path d="M433 910l17 18 17-18" fill="none" stroke="#df8a30" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)"><rect x="60" y="935" width="780" height="190" rx="26" fill="#262d45"/><rect x="60" y="935" width="16" height="190" rx="8" fill="#73baf1"/></g>
  <text x="105" y="985" fill="#a8d8ff" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="800">4 · 최종 출력 선택</text>
  <text x="105" y="1040" fill="#ffffff" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="44" font-weight="800">최종 요청은 높은 해상도로</text>
  <text x="105" y="1090" fill="#d9e2f3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="500">360p 초안과 장면이 같다는 보장은 없다</text>
  <text x="60" y="1168" fill="#59657a" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="34" font-weight="500">Google 공식 문서 기반 · 편집부 재구성</text>
</svg>
