<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">오픈웨이트 AI 이해관계 지도</title>
  <desc id="desc">인프라 기업, 보안 회사, 오픈소스 재단, 프런티어 연구소, 기업 고객이 오픈웨이트 논쟁에서 보는 이익과 위험을 지도처럼 정리</desc>
  <rect width="1120" height="620" fill="#f7f8fb"/>
  <g font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
    <text x="58" y="58" fill="#17231f" font-size="30" font-weight="800">누가 오픈웨이트를 원하는가, 누가 조심스러워하는가</text>
    <text x="62" y="94" fill="#5b6762" font-size="17">회사 역할이 다르면 같은 “안전”이라는 단어도 다른 제품 전략으로 번역된다.</text>
    <circle cx="560" cy="340" r="92" fill="#ffffff" stroke="#17231f" stroke-width="3"/>
    <text x="501" y="328" fill="#17231f" font-size="23" font-weight="900">오픈웨이트</text>
    <text x="522" y="360" fill="#17231f" font-size="23" font-weight="900">AI</text>
    <g>
      <rect x="70" y="140" width="330" height="130" rx="18" fill="#ffffff" stroke="#b9d1c7" stroke-width="2"/>
      <text x="104" y="184" fill="#2f6f62" font-size="22" font-weight="800">인프라 기업</text>
      <text x="104" y="220" fill="#46534f" font-size="16">모델이 많을수록 GPU·클라우드·추론</text>
      <text x="104" y="246" fill="#46534f" font-size="16">수요가 함께 늘어난다</text>
    </g>
    <g>
      <rect x="720" y="140" width="330" height="130" rx="18" fill="#ffffff" stroke="#d1c4e8" stroke-width="2"/>
      <text x="754" y="184" fill="#7357b7" font-size="22" font-weight="800">프런티어 연구소</text>
      <text x="754" y="220" fill="#46534f" font-size="16">성능과 접근 통제는 핵심 자산이며</text>
      <text x="754" y="246" fill="#46534f" font-size="16">공개 범위를 두고 가장 신중하다</text>
    </g>
    <g>
      <rect x="70" y="410" width="330" height="130" rx="18" fill="#ffffff" stroke="#e8c8a4" stroke-width="2"/>
      <text x="104" y="454" fill="#b0692b" font-size="22" font-weight="800">보안 회사</text>
      <text x="104" y="490" fill="#46534f" font-size="16">하네스·로그·탐지·레드팀 도구가</text>
      <text x="104" y="516" fill="#46534f" font-size="16">새로운 보안 시장을 만든다</text>
    </g>
    <g>
      <rect x="720" y="410" width="330" height="130" rx="18" fill="#ffffff" stroke="#cde0e8" stroke-width="2"/>
      <text x="754" y="454" fill="#276b85" font-size="22" font-weight="800">기업 고객</text>
      <text x="754" y="490" fill="#46534f" font-size="16">데이터 위치·비용·감사·공급자 종속을</text>
      <text x="754" y="516" fill="#46534f" font-size="16">한꺼번에 계산해야 한다</text>
    </g>
    <path d="M400 205C458 220 492 252 518 286" fill="none" stroke="#b5beba" stroke-width="7" stroke-linecap="round"/>
    <path d="M720 205C662 220 628 252 602 286" fill="none" stroke="#b5beba" stroke-width="7" stroke-linecap="round"/>
    <path d="M400 474C458 458 492 428 518 394" fill="none" stroke="#b5beba" stroke-width="7" stroke-linecap="round"/>
    <path d="M720 474C662 458 628 428 602 394" fill="none" stroke="#b5beba" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
