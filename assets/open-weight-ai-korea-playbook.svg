<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">한국 기업의 오픈웨이트 AI 도입 점검 흐름</title>
  <desc id="desc">한국 기업이 오픈웨이트 모델을 도입할 때 모델 출처, 데이터 위치, 권한 경계, 로그 감사, 사고 대응을 순서대로 점검하는 흐름도</desc>
  <rect width="1120" height="600" fill="#fbfaf7"/>
  <g font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
    <text x="58" y="58" fill="#17231f" font-size="30" font-weight="800">한국 기업에는 “성능”보다 운영 질문이 먼저 온다</text>
    <text x="62" y="94" fill="#5b6762" font-size="17">금융·제조·공공·통신·의료 조직은 오픈웨이트 모델을 쓰기 전 다섯 가지를 같이 확인해야 한다.</text>
    <defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 z" fill="#98a49f"/>
      </marker>
    </defs>
    <g>
      <rect x="66" y="170" width="176" height="150" rx="18" fill="#ffffff" stroke="#b9d1c7" stroke-width="2"/>
      <text x="96" y="216" fill="#2f6f62" font-size="20" font-weight="800">모델 출처</text>
      <text x="96" y="252" fill="#46534f" font-size="16">파일·해시·라이선스</text>
      <text x="96" y="278" fill="#46534f" font-size="16">업데이트 경로</text>
    </g>
    <path d="M250 244h72" stroke="#98a49f" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g>
      <rect x="330" y="170" width="176" height="150" rx="18" fill="#ffffff" stroke="#d1c4e8" stroke-width="2"/>
      <text x="360" y="216" fill="#7357b7" font-size="20" font-weight="800">데이터 위치</text>
      <text x="360" y="252" fill="#46534f" font-size="16">내부망 실행 여부</text>
      <text x="360" y="278" fill="#46534f" font-size="16">반출·보관 기준</text>
    </g>
    <path d="M514 244h72" stroke="#98a49f" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g>
      <rect x="594" y="170" width="176" height="150" rx="18" fill="#ffffff" stroke="#e8c8a4" stroke-width="2"/>
      <text x="624" y="216" fill="#b0692b" font-size="20" font-weight="800">권한 경계</text>
      <text x="624" y="252" fill="#46534f" font-size="16">파일·인터넷·도구</text>
      <text x="624" y="278" fill="#46534f" font-size="16">실행 권한 분리</text>
    </g>
    <path d="M778 244h72" stroke="#98a49f" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g>
      <rect x="858" y="170" width="176" height="150" rx="18" fill="#ffffff" stroke="#cde0e8" stroke-width="2"/>
      <text x="888" y="216" fill="#276b85" font-size="20" font-weight="800">로그 감사</text>
      <text x="888" y="252" fill="#46534f" font-size="16">프롬프트·출력</text>
      <text x="888" y="278" fill="#46534f" font-size="16">재현 가능한 기록</text>
    </g>
    <path d="M946 330v52H560" stroke="#98a49f" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/>
    <rect x="320" y="386" width="480" height="92" rx="22" fill="#17231f"/>
    <text x="402" y="426" fill="#ffffff" font-size="24" font-weight="800">사고 대응과 교체 가능성</text>
    <text x="402" y="458" fill="#dce7e1" font-size="17">모델 차단, 롤백, 대체 모델 전환, 고객 고지 절차</text>
    <text x="128" y="548" fill="#5a6762" font-size="17">요점: 오픈웨이트 도입은 모델 선택이 아니라 보안 운영 체계를 함께 들여오는 일이다.</text>
  </g>
</svg>
