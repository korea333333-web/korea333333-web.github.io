      <text x="280" y="574" fill="#59645f" font-size="15">09:00</text>
    </g>
    <g>
      <circle cx="506" cy="395" r="10" fill="#ffffff" stroke="#b73335" stroke-width="5"/>
      <text x="448" y="439" fill="#a22f31" font-size="16" font-weight="800">서킷브레이커</text>
