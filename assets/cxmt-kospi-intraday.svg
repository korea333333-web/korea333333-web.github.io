      <text x="72" y="296">6,500</text>
      <text x="72" y="406">6,200</text>
      <text x="72" y="516">5,900</text>
    </g>

    <line x1="112" y1="394" x2="754" y2="394" stroke="#c34b45" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="567" y="365" width="174" height="28" rx="5" fill="#fff1ef"/>
    <text x="579" y="385" fill="#a43a35" font-size="14" font-weight="700">1단계 CB 기준 -8%</text>

    <path d="M136 196 L316 327 L506 395 L716 447" fill="none" stroke="#b73335" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M136 196 L316 327 L506 395 L716 447 L716 544 L136 544 Z" fill="#b73335" opacity="0.08"/>

    <g>
      <circle cx="136" cy="196" r="10" fill="#ffffff" stroke="#355e54" stroke-width="5"/>
