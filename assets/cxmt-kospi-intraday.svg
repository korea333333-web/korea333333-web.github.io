<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">2026년 7월 28일 코스피 급락의 주요 시점</title>
  <desc id="desc">전일 종가, 개장가, 1단계 서킷브레이커 발동 시점, 오후 1시 21분 지수를 연결한 시점별 도표</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <g font-family="Segoe UI, Malgun Gothic, sans-serif">
