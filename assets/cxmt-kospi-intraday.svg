      <circle cx="872" cy="442" r="16" fill="#4a8d83"/>
      <text x="867" y="448" fill="#ffffff" font-size="16" font-weight="800">3</text>
      <text x="904" y="437" fill="#ffffff" font-size="18" font-weight="800">기대와 포지션 청산</text>
      <text x="904" y="465" fill="#cad2ce" font-size="15">AI 투자 지속성 우려와 높은 변동성이</text>
      <text x="904" y="488" fill="#cad2ce" font-size="15">중국발 재료를 증폭시켰다.</text>
    </g>
    <rect x="858" y="526" width="254" height="50" rx="6" fill="#32413b"/>
    <text x="879" y="557" fill="#ffffff" font-size="16" font-weight="700">급락의 원인 ≠ CXMT 하나</text>

    <text x="58" y="656" fill="#5e6864" font-size="15">자료: 한국거래소 발표를 인용한 국내 보도, AP, 사용자가 13:21에 확인한 시장 화면. 시점별 대표값을 재구성했으며 연속 가격 차트가 아니다.</text>
