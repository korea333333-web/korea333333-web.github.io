    <text x="58" y="94" fill="#5d6863" font-size="18">연속 시세가 아니라 급락을 설명하는 네 시점의 대표값</text>

    <rect x="58" y="126" width="740" height="482" rx="8" fill="#ffffff" stroke="#d9d5ca"/>
    <g stroke="#e7e3da" stroke-width="1">
      <line x1="112" y1="180" x2="754" y2="180"/>
      <line x1="112" y1="290" x2="754" y2="290"/>
      <line x1="112" y1="400" x2="754" y2="400"/>
      <line x1="112" y1="510" x2="754" y2="510"/>
    </g>
    <g fill="#7a827e" font-size="15">
