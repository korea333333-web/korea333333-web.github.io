<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">중국산 이머전 DUV의 생산 규모와 검증 과제</title>
  <desc id="desc">중국 보도의 생산 목표를 ASML의 2025년 이머전 DUV 실제 판매량과 비교하고 미확인 기술 항목을 정리한 도표</desc>
  <rect width="1200" height="720" fill="#f5f8f6"/>
  <g font-family="Segoe UI, Malgun Gothic, sans-serif">
    <text x="58" y="60" fill="#16231f" font-size="32" font-weight="800">‘생산 시작’과 ‘ASML 대체’ 사이에는 긴 검증 구간이 있다</text>
    <text x="58" y="94" fill="#5b6862" font-size="18">장비 1칸은 이머전 DUV 약 5대를 뜻한다</text>

    <rect x="58" y="128" width="610" height="500" rx="8" fill="#ffffff" stroke="#d4dfda"/>
    <text x="90" y="174" fill="#16231f" font-size="22" font-weight="800">생산 규모 비교</text>

    <text x="90" y="229" fill="#406359" font-size="17" font-weight="800">중국 보도상 2026 목표</text>
    <rect x="338" y="205" width="34" height="34" rx="4" fill="#d64f48"/>
    <text x="392" y="230" fill="#16231f" font-size="24" font-weight="900">약 5대</text>

    <text x="90" y="302" fill="#406359" font-size="17" font-weight="800">중국 보도상 2027 목표</text>
    <g fill="#d67b48">
      <rect x="338" y="277" width="34" height="34" rx="4"/>
      <rect x="380" y="277" width="34" height="34" rx="4"/>
      <rect x="422" y="277" width="34" height="34" rx="4"/>
      <rect x="464" y="277" width="34" height="34" rx="4"/>
    </g>
    <text x="518" y="302" fill="#16231f" font-size="24" font-weight="900">약 20대</text>

    <text x="90" y="375" fill="#406359" font-size="17" font-weight="800">ASML 2025 실제 판매</text>
    <g fill="#2f756d">
      <rect x="338" y="350" width="24" height="24" rx="3"/><rect x="370" y="350" width="24" height="24" rx="3"/><rect x="402" y="350" width="24" height="24" rx="3"/><rect x="434" y="350" width="24" height="24" rx="3"/><rect x="466" y="350" width="24" height="24" rx="3"/><rect x="498" y="350" width="24" height="24" rx="3"/><rect x="530" y="350" width="24" height="24" rx="3"/><rect x="562" y="350" width="24" height="24" rx="3"/><rect x="594" y="350" width="24" height="24" rx="3"/>
      <rect x="338" y="382" width="24" height="24" rx="3"/><rect x="370" y="382" width="24" height="24" rx="3"/><rect x="402" y="382" width="24" height="24" rx="3"/><rect x="434" y="382" width="24" height="24" rx="3"/><rect x="466" y="382" width="24" height="24" rx="3"/><rect x="498" y="382" width="24" height="24" rx="3"/><rect x="530" y="382" width="24" height="24" rx="3"/><rect x="562" y="382" width="24" height="24" rx="3"/><rect x="594" y="382" width="24" height="24" rx="3"/>
      <rect x="338" y="414" width="24" height="24" rx="3"/><rect x="370" y="414" width="24" height="24" rx="3"/><rect x="402" y="414" width="24" height="24" rx="3"/><rect x="434" y="414" width="24" height="24" rx="3"/><rect x="466" y="414" width="24" height="24" rx="3"/><rect x="498" y="414" width="24" height="24" rx="3"/><rect x="530" y="414" width="24" height="24" rx="3"/><rect x="562" y="414" width="24" height="24" rx="3"/>
    </g>
    <rect x="594" y="414" width="8" height="24" rx="2" fill="#2f756d"/>
    <text x="338" y="470" fill="#16231f" font-size="24" font-weight="900">약 131대</text>
    <text x="90" y="524" fill="#69746f" font-size="15">ASML 공식 자료: 2025년 전체 DUV 279대,</text>
    <text x="90" y="548" fill="#69746f" font-size="15">그중 이머전 47%를 환산한 값.</text>
    <rect x="90" y="572" width="520" height="34" rx="5" fill="#edf3f0"/>
    <text x="106" y="595" fill="#315d53" font-size="15" font-weight="700">중국 수치는 익명 소식통이 전한 계획이며 실제 인도·검수 완료량이 아니다.</text>

    <rect x="698" y="128" width="444" height="500" rx="8" fill="#1f2c28"/>
    <text x="734" y="174" fill="#ffffff" font-size="22" font-weight="800">아직 공개되지 않은 네 가지</text>
    <g>
      <rect x="734" y="206" width="372" height="76" rx="6" fill="#31423c"/>
      <text x="756" y="238" fill="#ffffff" font-size="18" font-weight="800">제조사와 장비 모델</text>
      <text x="756" y="264" fill="#cbd5d0" font-size="15">업체명과 정식 사양표가 공개되지 않았다.</text>
    </g>
    <g>
      <rect x="734" y="298" width="372" height="76" rx="6" fill="#31423c"/>
      <text x="756" y="330" fill="#ffffff" font-size="18" font-weight="800">해상도·오버레이·처리량</text>
      <text x="756" y="356" fill="#cbd5d0" font-size="15">어떤 공정에서 몇 장을 찍는지 알 수 없다.</text>
    </g>
    <g>
      <rect x="734" y="390" width="372" height="76" rx="6" fill="#31423c"/>
      <text x="756" y="422" fill="#ffffff" font-size="18" font-weight="800">가동률·수율·유지보수</text>
      <text x="756" y="448" fill="#cbd5d0" font-size="15">공장 장기 운전 데이터가 확인되지 않았다.</text>
    </g>
    <g>
      <rect x="734" y="482" width="372" height="76" rx="6" fill="#31423c"/>
      <text x="756" y="514" fill="#ffffff" font-size="18" font-weight="800">고객 검수와 반복 주문</text>
      <text x="756" y="540" fill="#cbd5d0" font-size="15">SMIC·화훙·CXMT의 인수 확인이 필요하다.</text>
    </g>
    <text x="58" y="674" fill="#5c6862" font-size="15">자료: The Information 보도를 재전한 Reuters, ASML 2025 연차보고서와 2026년 실적 설명. 수량은 기술 수준이나 생산성을 뜻하지 않는다.</text>
  </g>
</svg>
