    <rect x="96" y="194" width="108" height="14" rx="7" fill="#b6a7de"/>
    <circle cx="250" cy="70" r="34" fill="#7a5bb7"/>
    <text x="236" y="84" fill="#ffffff" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="42" font-weight="900">!</text>
    <text x="72" y="314" fill="#4e3d78" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="22" font-weight="800">능력별 안전 테스트</text>
  </g>
  <g transform="translate(866 238)">
    <rect x="0" y="0" width="320" height="300" rx="22" fill="#fff1e2" stroke="#e6c9aa" stroke-width="2"/>
    <rect x="74" y="130" width="172" height="118" rx="16" fill="#ffffff" stroke="#b0692b" stroke-width="3"/>
    <rect x="106" y="88" width="108" height="42" rx="10" fill="#d9951e"/>
    <rect x="118" y="64" width="84" height="36" rx="14" fill="#f1c778"/>
    <circle cx="118" cy="170" r="16" fill="#b0692b"/>
    <circle cx="160" cy="170" r="16" fill="#b0692b"/>
    <circle cx="202" cy="170" r="16" fill="#b0692b"/>
    <path d="M118 212h84" stroke="#b0692b" stroke-width="12" stroke-linecap="round"/>
    <path d="M48 104c38-54 86-80 144-78 44 2 78 18 102 47" fill="none" stroke="#be7a39" stroke-width="8" stroke-linecap="round" opacity=".6"/>
    <text x="60" y="314" fill="#74491f" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="22" font-weight="800">데이터센터와 기업 운영</text>
