<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">오픈웨이트 AI 보안 논쟁 일러스트</title>
  <desc id="desc">열린 모델 저장소, 보안 방패, 정책 문서, 데이터센터를 신문 일러스트 스타일로 표현한 그림</desc>
  <rect width="1280" height="720" fill="#f5f7f4"/>
  <rect x="48" y="48" width="1184" height="624" rx="28" fill="#fffdf8" stroke="#d7dfd7" stroke-width="2"/>
  <g font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
    <text x="92" y="118" fill="#18231f" font-size="42" font-weight="800">오픈웨이트 AI는 이제 보안 인프라의 문제다</text>
    <text x="96" y="164" fill="#53625d" font-size="21">정책, 공개 모델, 사이버 방어, 기업 운영이 한 화면에 겹치기 시작했다.</text>
  </g>
  <g transform="translate(94 238)">
    <rect x="0" y="0" width="320" height="300" rx="22" fill="#e8f2ee" stroke="#b9d1c7" stroke-width="2"/>
    <rect x="52" y="76" width="216" height="154" rx="16" fill="#ffffff" stroke="#89b5a5" stroke-width="3"/>
    <path d="M86 118h146M86 154h110M86 190h146" stroke="#2f6f62" stroke-width="10" stroke-linecap="round"/>
    <path d="M160 42l76 36v58c0 63-35 101-76 122-41-21-76-59-76-122V78z" fill="#2f6f62" opacity=".14" stroke="#2f6f62" stroke-width="4"/>
    <path d="M127 145l24 24 48-58" fill="none" stroke="#2f6f62" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="272" fill="#25483e" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="22" font-weight="800">열린 모델 + 검증 가능한 방어</text>
  </g>
  <g transform="translate(480 238)">
    <rect x="0" y="0" width="320" height="300" rx="22" fill="#f2edf8" stroke="#d1c4e8" stroke-width="2"/>
    <rect x="70" y="56" width="180" height="220" rx="18" fill="#ffffff" stroke="#8b72c8" stroke-width="3"/>
    <rect x="96" y="90" width="128" height="20" rx="10" fill="#8b72c8"/>
    <rect x="96" y="130" width="90" height="14" rx="7" fill="#b6a7de"/>
