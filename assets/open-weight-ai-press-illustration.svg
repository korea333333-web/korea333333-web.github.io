  <path d="M416 386h58M802 386h58" stroke="#aeb9b3" stroke-width="9" stroke-linecap="round"/>
  <g font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
    <rect x="128" y="588" width="1024" height="52" rx="26" fill="#18231f"/>
    <text x="166" y="622" fill="#ffffff" font-size="20" font-weight="700">핵심 질문: 오픈 모델을 막을 것인가보다, 누가 안전하게 실행하고 감사할 기반을 만들 것인가가 더 중요해졌다.</text>
  </g>
