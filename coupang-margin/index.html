<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿠팡 마진 계산기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: 한 화면 — 판매가+수량 / 2열 입력칸 / 최종 예상이익 / 내역. 칸 고정, 숫자 길면 글자만 작아짐 */
:root{
  --bg:#eef1f4; --paper:#ffffff; --fg:#1c2330; --muted:#5f6b7a; --line:#d3d9e1;
  --accent:#3457d5; --accent-fg:#ffffff; --good:#1f7a4d; --bad:#c0362c; --soft:#f5f7fa;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --paper:#1b212b; --fg:#e8ecf2; --muted:#a2adbb; --line:#343d4b;
  --accent:#7b96ff; --accent-fg:#0d1220; --good:#6fd39a; --bad:#ff8a80; --soft:#232a36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --paper:#1b212b; --fg:#e8ecf2; --muted:#a2adbb; --line:#343d4b;
  --accent:#7b96ff; --accent-fg:#0d1220; --good:#6fd39a; --bad:#ff8a80; --soft:#232a36; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.3;margin:0;padding:12px 12px 14px}
.wrap{max-width:520px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
h1{font-size:20px;margin:0}
.sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lab{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 4px 2px;white-space:nowrap}
.cell{height:54px;border:2px solid var(--line);border-radius:12px;background:var(--soft);display:flex;align-items:center;padding:0 10px;min-width:0;overflow:hidden}
.cell:focus-within{border-color:var(--accent);background:var(--paper)}
.cell input{flex:1;width:100%;min-width:0;border:0;background:transparent;color:var(--fg);font:700 22px var(--sans);text-align:right;outline:none;white-space:nowrap;font-variant-numeric:tabular-nums;padding:0}
.cell .u{color:var(--muted);font-size:14px;margin-left:4px;flex:none}

.top{display:grid;grid-template-columns:1fr 96px;gap:8px}
.big .cell{height:64px}
.big .cell input{font-size:28px}
.qty{height:64px;display:grid;grid-template-columns:30px 1fr 30px;align-items:center;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
.qty button{height:100%;border:0;background:var(--accent);color:var(--accent-fg);font-size:20px;font-weight:700;cursor:pointer;touch-action:manipulation;padding:0}
.qty button:active{filter:brightness(.9)}
.qty b{text-align:center;font-size:24px;font-variant-numeric:tabular-nums}

.result{background:var(--soft);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.result .lab{margin:0}
.final{font-size:38px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;color:var(--good)}
.final.neg{color:var(--bad)}
.rows{display:grid;gap:0;margin-top:4px}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.rows span{color:var(--muted)}
.rows b{font-variant-numeric:tabular-nums;white-space:nowrap}
.reset{height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font:700 17px var(--sans);cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.note{font-size:11px;color:var(--muted);margin:0;line-height:1.45}
.brand{margin:0;text-align:center;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.brand b{color:var(--accent);letter-spacing:.12em}
</style>

<div class="wrap">
  <header>
    <h1>쿠팡 마진 계산기</h1>
    <p class="sub">(주)대국종합물류 판매 수익 계산</p>
  </header>

  <div class="top">
    <div class="big"><div class="lab">쿠팡 판매가격</div><label class="cell" for="price"><input id="price" inputmode="numeric"><span class="u">원</span></label></div>
    <div><div class="lab">수량</div><div class="qty"><button type="button" id="dn" aria-label="수량 줄이기">−</button><b id="q">1</b><button type="button" id="up" aria-label="수량 늘리기">+</button></div></div>
  </div>

  <div class="g2">
    <div><div class="lab">매입원가 (1개)</div><label class="cell" for="cost"><input id="cost" inputmode="numeric"><span class="u">원</span></label></div>
    <div><div class="lab">택배비</div><label class="cell" for="ship"><input id="ship" inputmode="numeric"><span class="u">원</span></label></div>
    <div><div class="lab">쿠팡 수수료</div><label class="cell" for="fee"><input id="fee" inputmode="decimal"><span class="u">%</span></label></div>
    <div><div class="lab">기타 비용</div><label class="cell" for="etc"><input id="etc" inputmode="numeric"><span class="u">원</span></label></div>
    <div><div class="lab">세금 대비 적립률</div><label class="cell" for="tax"><input id="tax" inputmode="decimal"><span class="u">%</span></label></div>
    <div><div class="lab">최종 마진율</div><div class="cell" style="background:transparent;border-style:dashed"><input id="rate" readonly tabindex="-1" aria-label="최종 마진율"></div></div>
  </div>

  <section class="result" aria-live="polite">
    <div class="lab">최종 예상이익</div>
    <div class="final" id="final">0원</div>
    <div class="rows">
      <div><span>쿠팡 수수료</span><b id="feeW">0원</b></div>
      <div><span>매입원가 합계</span><b id="costW">0원</b></div>
      <div><span>비용 차감 후 예상이익</span><b id="pre">0원</b></div>
      <div><span>세금 대비 적립금</span><b id="taxW">0원</b></div>
    </div>
  </section>

  <button type="button" class="reset" id="reset">초기값으로 복원</button>

  <p class="note">계산식: 판매가 − 쿠팡 수수료 − 매입원가×수량 − 택배비 − 기타 비용 = 비용 차감 후 예상이익. 예상이익이 양수이면 적립률만큼 차감합니다. 실제 세금은 부가가치세, 법인세, 비용 처리에 따라 달라집니다.</p>
  <p class="brand">Made by <b>KIKUKE AI</b></p>
</div>

<script>
const DEF={price:10000,cost:4000,ship:3000,fee:12,etc:0,tax:10,q:1};
const IDS=['price','cost','ship','fee','etc','tax'];
const PCT=['fee','tax'];
const $=id=>document.getElementById(id);
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n};
const won=n=>(n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('ko-KR')+'원';
let q=DEF.q;

function fit(el,base){
  const t=(el.value!==undefined?el.value:el.textContent)||'';
  const w=el.clientWidth||80;
  el.style.fontSize=Math.max(11,Math.min(base,w/(Math.max(t.length,1)*0.6)))+'px';
}
function setVal(id,v){$(id).value=PCT.includes(id)?String(v):(v?Number(v).toLocaleString('ko-KR'):'0')}
function load(d){IDS.forEach(id=>setVal(id,d[id]));q=d.q||1;$('q').textContent=q}
function save(){try{const o={q};IDS.forEach(id=>o[id]=num($(id).value));localStorage.setItem('coupang-margin',JSON.stringify(o))}catch(e){}}

function calc(){
  const P=num($('price').value),C=num($('cost').value)*q,S=num($('ship').value),
        F=P*num($('fee').value)/100,E=num($('etc').value),T=num($('tax').value)/100;
  const pre=P-F-C-S-E;
  const tw=pre>0?pre*T:0;
  const fin=pre-tw;
  $('feeW').textContent=won(F);
  $('costW').textContent=won(C);
  $('pre').textContent=won(pre);
  $('taxW').textContent=won(tw);
  $('final').textContent=won(fin);
  $('final').classList.toggle('neg',fin<0);
  $('rate').value=P?(fin/P*100).toFixed(2)+'%':'-';
  $('rate').style.color=fin<0?'var(--bad)':'var(--good)';
  fit($('price'),28);IDS.slice(1).forEach(id=>fit($(id),22));fit($('rate'),22);fit($('final'),38);
  save();
}
function fmt(el){const raw=el.value.replace(/[^0-9]/g,'');el.value=raw?Number(raw).toLocaleString('ko-KR'):''}

IDS.forEach(id=>$(id).addEventListener('input',e=>{if(!PCT.includes(id))fmt(e.target);calc()}));
$('up').onclick=()=>{q++;$('q').textContent=q;calc()};
$('dn').onclick=()=>{q=Math.max(1,q-1);$('q').textContent=q;calc()};
$('reset').onclick=()=>{load(DEF);calc()};
window.addEventListener('resize',calc);

let saved=null;try{saved=JSON.parse(localStorage.getItem('coupang-margin'))}catch(e){}
load(saved&&typeof saved==='object'?Object.assign({},DEF,saved):DEF);
calc();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(calc);
</script>
</html>
